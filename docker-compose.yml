# Punto y Sal - ReservasPyS backend
# Starts the API Gateway, the business microservices, the auth
# service and the notifications service (Sprint 5).
# The PostgreSQL database is external (NeonDB): no database container here.
#
# Usage (from the repository root, with a local .env containing DATABASE_URL
# and JWT_SECRET - see .env.example):
#   docker compose up --build

services:
  clientes:
    build:
      context: .
      dockerfile: services/clientes/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  reservas:
    build:
      context: .
      dockerfile: services/reservas/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
      CATALOGO_SERVICE_URL: "http://catalogo:8003"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  catalogo:
    build:
      context: .
      dockerfile: services/catalogo/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
    ports:
      - "8003:8003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
    ports:
      - "8004:8004"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  notificaciones:
    build:
      context: .
      dockerfile: services/notificaciones/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "8005:8005"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"
    volumes:
      - redis_data:/data

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      CLIENTES_SERVICE_URL: "http://clientes:8001"
      RESERVAS_SERVICE_URL: "http://reservas:8002"
      CATALOGO_SERVICE_URL: "http://catalogo:8003"
      AUTH_SERVICE_URL: "http://auth:8004"
      NOTIFICACIONES_SERVICE_URL: "http://notificaciones:8005"
      CORS_ORIGINS: "${CORS_ORIONS:-}"
    ports:
      - "8000:8000"
    depends_on:
      clientes:
        condition: service_healthy
      reservas:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      auth:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

volumes:
  redis_data:
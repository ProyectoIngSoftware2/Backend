# Punto y Sal - ReservasPyS backend
# Starts the API Gateway, the three business microservices and the auth
# service (Sprint 2: services/auth is the only login provider).
# The PostgreSQL database is external (NeonDB): no database container here.
#
# Usage (from the repository root, with a local .env containing DATABASE_URL
# and JWT_SECRET - see .env.example):
#   docker compose up --build
#
# The gateway is the public entry point: http://localhost:8000

services:
  clientes:
    build:
      context: .
      dockerfile: services/clientes/Dockerfile
    environment:
      # Passed through from the host .env file (never committed).
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      # JWT settings (Sprint 2 authentication). JWT_SECRET is required:
      # the services fail closed instead of falling back to any default.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
    ports:
      - "8001:8001" # published for testing only; the gateway is the public entry point
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  reservas:
    build:
      context: .
      dockerfile: services/reservas/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
      # F-01: reservas resolves dish names from catalogo over HTTP.
      CATALOGO_SERVICE_URL: "http://catalogo:8003"
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  catalogo:
    build:
      context: .
      dockerfile: services/catalogo/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
    ports:
      - "8003:8003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      # JWT settings used to sign the access tokens (the auth service is
      # the only service that issues them).
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
    ports:
      - "8004:8004" # published for testing only; login goes through the gateway
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      # Internal URLs use the Compose service names.
      CLIENTES_SERVICE_URL: "http://clientes:8001"
      RESERVAS_SERVICE_URL: "http://reservas:8002"
      CATALOGO_SERVICE_URL: "http://catalogo:8003"
      AUTH_SERVICE_URL: "http://auth:8004"
      # Comma-separated frontend origins allowed by CORS (empty = no
      # CORS middleware, so no origin is allowed until configured).
      # The gateway never parses tokens, so no JWT variables are needed
      # here: it forwards the Authorization header untouched.
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    ports:
      - "8000:8000"
    depends_on:
      clientes:
        condition: service_healthy
      reservas:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

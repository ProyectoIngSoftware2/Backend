# Punto y Sal - ReservasPyS backend
# Starts the API Gateway and the three microservices.
# The PostgreSQL database is external (NeonDB): no database container here.
#
# Usage (from the repository root, with a local .env containing DATABASE_URL):
#   docker compose up --build
#
# The gateway is the public entry point: http://localhost:8000

services:
  clientes:
    build:
      context: .
      dockerfile: services/clientes/Dockerfile
    environment:
      # Passed through from the host .env file (never committed).
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
    ports:
      - "8001:8001" # published for testing only; the gateway is the public entry point
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  reservas:
    build:
      context: .
      dockerfile: services/reservas/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      # F-01: reservas resolves dish names from catalogo over HTTP.
      CATALOGO_SERVICE_URL: "http://catalogo:8003"
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  catalogo:
    build:
      context: .
      dockerfile: services/catalogo/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
    ports:
      - "8003:8003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      # Internal URLs use the Compose service names.
      CLIENTES_SERVICE_URL: "http://clientes:8001"
      RESERVAS_SERVICE_URL: "http://reservas:8002"
      CATALOGO_SERVICE_URL: "http://catalogo:8003"
    ports:
      - "8000:8000"
    depends_on:
      clientes:
        condition: service_healthy
      reservas:
        condition: service_healthy
      catalogo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
